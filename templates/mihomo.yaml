# ref: <https://wiki.metacubex.one/config/>

allow-lan: true
bind-address: "*"
lan-allowed-ips:
  # ref: <https://docs.docker.com/engine/network/#automatic-subnet-allocation>
  # ref: <https://tailscale.com/docs/reference/reserved-ip-addresses>
  # ref: <https://www.iana.org/assignments/iana-ipv4-special-registry>
  # ref: <https://www.iana.org/assignments/iana-ipv6-special-registry>
  - 100.64.0.0/10 # tailscale
  - 127.0.0.0/8 # loopback
  - ::1/128 # loopback
  - fd7a:115c:a1e0::/48 # tailscale
skip-auth-prefixes:
  - 127.0.0.0/8 # loopback
  - ::1/128 # loopback
mode: rule
log-level: warning
ipv6: true
external-controller: 127.0.0.1:9090
external-ui: ui
external-ui-url: https://github.com/liblaf/mirrors-zashboard/archive/refs/heads/gh-pages.zip
profile:
  store-selected: true
  store-fake-ip: true
unified-delay: true
tcp-concurrent: true
geo-auto-update: true
geo-update-interval: 24 # hours
geox-url: # ref: <https://github.com/MetaCubeX/mihomo/blob/ac017cdd246ce8bd547653d927e7bf77d7ee73d5/config/config.go#L578-L583>
  geoip: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb
  asn: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb

dns:
  enable: true
  cache-algorithm: arc
  ipv6: true
  enhanced-mode: redir-host
  use-hosts: true
  use-system-hosts: true
  respect-rules: true
  # ref: <https://dns.icoa.cn/>
  # ref: <https://tuna.moe/help/dns/>
  # ref: <https://www.114dns.com/>
  # ref: <https://www.dnspod.cn/products/publicdns>
  default-nameserver:
    - system
    - 101.6.6.6 # TUNA DNS666
    - 119.29.29.29 # DNSPod Public DNS
    - 223.5.5.5 # 阿里云公共 DNS
  nameserver-policy:
    rule-set:domain-cn: &dns-cn
      - system
      - https://101.6.6.6/dns-query # TUNA DNS666
      - https://dns.alidns.com/dns-query # 阿里云公共 DNS
      - https://doh.pub/dns-query # DNSPod Public DNS
    rule-set:domain-global: &dns-global
      - https://cloudflare-dns.com/dns-query
      - https://dns.google/dns-query
  proxy-server-nameserver: *dns-cn
  direct-nameserver: *dns-cn
  nameserver: *dns-global

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - +.push.apple.com
    - Mijia Cloud

mixed-port: 7892

tun:
  enable: false
  stack: mixed
  auto-route: true
  auto-redirect: false
  auto-detect-interface: true
  dns-hijack:
    - udp://any:53
    - tcp://any:53
  strict-route: true
  route-exclude-address:
    # ref: <https://tailscale.com/docs/reference/reserved-ip-addresses>
    - 100.64.0.0/10 # tailscale
    - fd7a:115c:a1e0::/48 # tailscale
  exclude-interface:
    - tailscale0

proxies:
  $flatten:
    - $map:
        $eval: proxies
      each(proxy):
        $eval: proxy.mihomo
    - - name: TAILSCALE
        type: direct
        udp: true
        interface-name: tailscale0
    - $map:
        $eval: infoProxies
      each(proxy):
        $eval: proxy.mihomo

__proxy-group-anchors:
  proxy-group: &proxy-group
    url: https://cp.cloudflare.com
    interval: 300 # seconds
    lazy: true
    timeout: 1200 # milliseconds
    max-failed-times: 1
    expected-status: 204

proxy-groups:
  $flatten:
    - - name: PROXY
        type: select
        proxies:
          $flatten:
            - - Auto
            - $map:
                $eval: countries
              each(country): ${country.name}
        <<: *proxy-group
        icon: https://cdn.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Proxy.png
      - name: Auto
        type: url-test
        proxies:
          $map:
            $eval: proxies
          each(proxy):
            $if: proxy.country.cca2 != "UN"
            then:
              $eval: proxy.name
        <<: *proxy-group
        icon: https://cdn.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Auto.png
      - name: Info
        type: select
        proxies:
          $map:
            $eval: infoProxies
          each(proxy):
            $eval: proxy.name
        <<: *proxy-group
        icon: https://cdn.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Available.png
      - name: Crypto
        type: url-test
        proxies:
          $map:
            $eval: proxies
          each(proxy):
            $if: proxy.country.cca2 in CRYPTO_COUNTRIES
            then:
              $eval: proxy.name
        <<: *proxy-group
        url: https://api.binance.com/api/v3/ping
        expected-status: 200
        icon: https://cdn.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Cryptocurrency.png
      - name: Unknown
        type: select
        proxies:
          $map:
            $eval: proxies
          each(proxy):
            $if: proxy.country.cca2 == "UN"
            then:
              $eval: proxy.name
        <<: *proxy-group
        icon: https://cdn.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/United_Nations.png
    - $map:
        $eval: countries
      each(country):
        name: ${country.name}
        type: url-test
        proxies:
          $map:
            $eval: country.proxies
          each(proxy):
            $eval: proxy.name
        <<: *proxy-group
        icon: ${country.icon}

rules:
  - RULE-SET,domain-lan,DIRECT
  - RULE-SET,domain-tailscale,TAILSCALE
  - RULE-SET,domain-cn,DIRECT
  - RULE-SET,domain-crypto,Crypto
  - RULE-SET,domain-us,United States
  - RULE-SET,domain-global,PROXY

  - RULE-SET,ipcidr-lan,DIRECT,no-resolve
  - RULE-SET,ipcidr-tailscale,TAILSCALE,no-resolve
  - RULE-SET,ipcidr-cn,DIRECT,no-resolve
  - RULE-SET,ipcidr-us,United States,no-resolve
  - RULE-SET,ipcidr-global,PROXY,no-resolve

  - NOT,((DST-PORT,53/80/853/443)),DIRECT
  - MATCH,PROXY

__rule-providers-anchors:
  domain: &domain
    type: http
    behavior: domain
    format: mrs
    interval: 86400 # seconds
  ipcidr: &ipcidr
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400 # seconds

rule-providers:
  domain-cn:
    <<: *domain
    url: https://cdn.jsdelivr.net/gh/liblaf/route-rules@mihomo/cn.domain.mrs
    path: ./ruleset/cn.domain.mrs
  ipcidr-cn:
    <<: *ipcidr
    url: https://cdn.jsdelivr.net/gh/liblaf/route-rules@mihomo/cn.ipcidr.mrs
    path: ./ruleset/cn.ipcidr.mrs
  domain-crypto:
    <<: *domain
    url: https://cdn.jsdelivr.net/gh/liblaf/route-rules@mihomo/crypto.domain.mrs
    path: ./ruleset/crypto.domain.mrs
  domain-global:
    <<: *domain
    url: https://cdn.jsdelivr.net/gh/liblaf/route-rules@mihomo/global.domain.mrs
    path: ./ruleset/global.domain.mrs
  ipcidr-global:
    <<: *ipcidr
    url: https://cdn.jsdelivr.net/gh/liblaf/route-rules@mihomo/global.ipcidr.mrs
    path: ./ruleset/global.ipcidr.mrs
  domain-lan:
    <<: *domain
    url: https://cdn.jsdelivr.net/gh/liblaf/route-rules@mihomo/lan.domain.mrs
    path: ./ruleset/lan.domain.mrs
  ipcidr-lan:
    <<: *ipcidr
    url: https://cdn.jsdelivr.net/gh/liblaf/route-rules@mihomo/lan.ipcidr.mrs
    path: ./ruleset/lan.ipcidr.mrs
  domain-tailscale:
    <<: *domain
    url: https://cdn.jsdelivr.net/gh/liblaf/route-rules@mihomo/tailscale.domain.mrs
    path: ./ruleset/tailscale.domain.mrs
  ipcidr-tailscale:
    <<: *ipcidr
    url: https://cdn.jsdelivr.net/gh/liblaf/route-rules@mihomo/tailscale.ipcidr.mrs
    path: ./ruleset/tailscale.ipcidr.mrs
  domain-us:
    <<: *domain
    url: https://cdn.jsdelivr.net/gh/liblaf/route-rules@mihomo/us.domain.mrs
    path: ./ruleset/us.domain.mrs
  ipcidr-us:
    <<: *ipcidr
    url: https://cdn.jsdelivr.net/gh/liblaf/route-rules@mihomo/us.ipcidr.mrs
    path: ./ruleset/us.ipcidr.mrs
