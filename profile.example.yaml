# Example native Stash profile.
# Metadata is optional for build and required for publish.
__sub-store:
  id: 0123456789ABCDEFGHJK
  target: stash
  # Optional subscription response headers.
  name: My subscription
  update-interval: 24 # Hours between client updates.
  web-page-url: https://example.com/account

mode: rule
log-level: info

# Private anchor definitions are removed after YAML merges are resolved.
__health-check: &health-check
  benchmark-url: https://cp.cloudflare.com/generate_204
  interval: 300

# Native, locally defined proxies are preserved.
proxies:
  - name: Local Direct
    type: direct

proxy-providers:
  Example:
    url: https://example.invalid/subscription.yaml
    override:
      # Applies to expanded Provider Proxies; omission preserves upstream values.
      skip-cert-verify: false
      additional-prefix: "[Example] "
      proxy-name:
        - pattern: "(?i)^proxy (?<number>[0-9]+)$"
          target: "Proxy $<number>"
    __sub-store:
      strip-common-affixes: false
      # JMS API: use the complete private URL from the service's Bandwidth Counter page.
      # bwcounter: https://justmysocks.net/members/getbwcounter.php?service=SERVICE_ID&id=API_ID
      # format: mixed

proxy-groups:
  - name: PROXY
    type: select
    proxies: [Local Direct]
    use: [Auto, Selected]
  - name: Auto
    <<: *health-check
    type: url-test
    include-all-providers: true
    exclude-filter: "Traffic|剩余流量"
  - name: Selected
    type: select
    use: [Example]
    filter: "Proxy [12]$"
  # Generated Info Proxies are for display; keep this group out of routing groups.
  - name: Info
    type: select
    use: [$info]

rules:
  - MATCH,PROXY
